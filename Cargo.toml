[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.103"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = { version = "2", features = ["serde"] }
ipnet = "2"
ring = "0.17"
regex = "1"
walkdir = "2"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29"
futures = "0.3"
zeroize = "1"
web-discovery = { path = "crates/web-discovery" }

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
